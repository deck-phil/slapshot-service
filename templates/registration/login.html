{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login</title>
  <link rel="icon" type="image/png" href="{% static 'stats/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'stats/global.css' %}">
  <style>
    .login-wrapper {
      max-width: 360px;
      margin: 120px auto 0 auto;
      padding: 0 24px;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .login-form label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #c1d8f2;
      margin-bottom: 2px;
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .login-form input {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #2a6aaa;
      background-color: #0e416f;
      color: #e5f3ff;
      font-size: 14px;
      outline: none;
    }
    .login-form input:focus {
      border-color: #1ea7ff;
    }
    .login-errors {
      font-size: 13px;
      color: #ff6b6b;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="page-title">Login</div>
    {% if form.errors %}
      <p class="login-errors">Invalid username or password.</p>
    {% endif %}
    <form method="post" class="login-form">
      {% csrf_token %}
      <div class="login-field">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus>
      </div>
      <div class="login-field">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password">
      </div>
      <button type="submit" class="btn-primary" style="margin-top: 8px;">Sign in</button>
    </form>
  </div>
</body>
</html>
