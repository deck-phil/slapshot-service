{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Stats{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'stats/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'stats/global.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
</body>
<script>
    (function () {
        function parseCell(text, type, cellEl) {
            text = text.trim();
            if (type === 'number') {
                var n = parseFloat(text.replace(/[^\d.-]/g, ''));
                return isNaN(n) ? 0 : n;
            }
            if (type === 'date') {
                const tsAttr = cellEl?.getAttribute('data-timestamp');
                if (!tsAttr) return 0;
                const n = Number(tsAttr);
                return isNaN(n) ? 0 : n;
            }

            return text.toLowerCase();
        }

        function sortTable(tbody, columnIndex, type, asc) {
            const rows = Array.from(tbody.querySelectorAll('tr'));

            rows.sort(function (a, b) {
                const aCell = a.children[columnIndex];
                const bCell = b.children[columnIndex];

                const aText = aCell ? aCell.textContent : '';
                const bText = bCell ? bCell.textContent : '';

                const aVal = parseCell(aText, type, aCell);
                const bVal = parseCell(bText, type, bCell);

                if (aVal < bVal) return asc ? -1 : 1;
                if (aVal > bVal) return asc ? 1 : -1;
                return 0;
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('table.js-sortable').forEach(function (table) {
                const tbody = table.querySelector('tbody');
                if (!tbody) return;

                const headers = table.querySelectorAll('thead th');

                headers.forEach(function (th, index) {
                    if (th.hasAttribute('data-sort-disabled')) return;

                    th.classList.add('sortable');
                    th.setAttribute('aria-sort', 'none');
                    th.dataset.sortDir = 'none';

                    th.addEventListener('click', function () {
                        const type = th.getAttribute('data-type') || 'string';

                        // reset other headers
                        headers.forEach(function (otherTh) {
                            if (otherTh === th) return;
                            otherTh.dataset.sortDir = 'none';
                            otherTh.classList.remove('sort-asc', 'sort-desc');
                            otherTh.setAttribute('aria-sort', 'none');
                        });

                        // toggle dir
                        const current = th.dataset.sortDir;
                        const asc = current !== 'asc';

                        th.dataset.sortDir = asc ? 'asc' : 'desc';
                        th.classList.toggle('sort-asc', asc);
                        th.classList.toggle('sort-desc', !asc);
                        th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');

                        sortTable(tbody, index, type, asc);
                    });
                });

                const defaultTh = table.querySelector('thead th[data-default-sort]');
                if (defaultTh) {
                    const index = Array.prototype.indexOf.call(headers, defaultTh);
                    const type = defaultTh.getAttribute('data-type') || 'string';
                    const dirAttr = defaultTh.getAttribute('data-default-sort') || 'asc';
                    const asc = dirAttr !== 'desc';

                    // set initial state classes/aria
                    headers.forEach(function (otherTh) {
                        otherTh.dataset.sortDir = 'none';
                        otherTh.classList.remove('sort-asc', 'sort-desc');
                        otherTh.setAttribute('aria-sort', 'none');
                    });

                    defaultTh.dataset.sortDir = asc ? 'asc' : 'desc';
                    defaultTh.classList.add(asc ? 'sort-asc' : 'sort-desc');
                    defaultTh.setAttribute('aria-sort', asc ? 'ascending' : 'descending');

                    sortTable(tbody, index, type, asc);
                }
            });
        });
    })();
</script>
<script>
    (function () {
        var STORAGE_KEY = 'slapshot_col_prefs';

        function getPrefs() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function savePrefs(prefs) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs));
            } catch (e) {}
        }

        function applyVisibility(col, visible, table) {
            // header cells
            table.querySelectorAll('thead th[data-col="' + col + '"]').forEach(function (el) {
                el.classList.toggle('col-hidden', !visible);
            });
            // body cells
            table.querySelectorAll('tbody td[data-col="' + col + '"]').forEach(function (el) {
                el.classList.toggle('col-hidden', !visible);
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            var toggleBar = document.getElementById('colToggles');
            if (!toggleBar) return;

            var table = document.querySelector('.stats-table');
            if (!table) return;

            var buttons = toggleBar.querySelectorAll('.col-toggle-btn');
            var prefs = getPrefs();

            // Build initial state: default active state from HTML, then override with saved prefs
            var state = {};
            buttons.forEach(function (btn) {
                var col = btn.getAttribute('data-col');
                // HTML default: active class present = visible
                state[col] = btn.classList.contains('active');
            });

            if (prefs) {
                Object.keys(prefs).forEach(function (col) {
                    if (col in state) state[col] = prefs[col];
                });
            }

            // Apply initial state
            buttons.forEach(function (btn) {
                var col = btn.getAttribute('data-col');
                var visible = state[col];
                btn.classList.toggle('active', visible);
                applyVisibility(col, visible, table);
            });

            // Wire up click handlers
            buttons.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var col = btn.getAttribute('data-col');
                    state[col] = !state[col];
                    btn.classList.toggle('active', state[col]);
                    applyVisibility(col, state[col], table);
                    savePrefs(state);
                });
            });
        });
    })();
</script>
</html>
