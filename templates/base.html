{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Stats{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'stats/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'stats/global.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
</body>
<script>
    // ─── Table Sorter ────────────────────────────────────────────────────────────
    (function () {
        function parseCell(text, type, cellEl) {
            text = text.trim();
            if (type === 'number') {
                const n = parseFloat(text.replace(/[^\d.-]/g, ''));
                return isNaN(n) ? 0 : n;
            }
            if (type === 'date') {
                const tsAttr = cellEl?.getAttribute('data-timestamp');
                if (!tsAttr) return 0;
                const n = Number(tsAttr);
                return isNaN(n) ? 0 : n;
            }
            return text.toLowerCase();
        }

        function sortTable(tbody, columnIndex, type, asc) {
            const rows = Array.from(tbody.querySelectorAll('tr'));
            rows.sort(function (a, b) {
                const aCell = a.children[columnIndex];
                const bCell = b.children[columnIndex];
                const aVal = parseCell(aCell ? aCell.textContent : '', type, aCell);
                const bVal = parseCell(bCell ? bCell.textContent : '', type, bCell);
                if (aVal < bVal) return asc ? -1 : 1;
                if (aVal > bVal) return asc ? 1 : -1;
                return 0;
            });
            rows.forEach(row => tbody.appendChild(row));
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('table.js-sortable').forEach(function (table) {
                const tbody = table.querySelector('tbody');
                if (!tbody) return;

                const headers = table.querySelectorAll('thead th');

                headers.forEach(function (th, index) {
                    if (th.hasAttribute('data-sort-disabled')) return;

                    th.classList.add('sortable');
                    th.setAttribute('aria-sort', 'none');
                    th.dataset.sortDir = 'none';

                    th.addEventListener('click', function () {
                        const type = th.getAttribute('data-type') || 'string';

                        headers.forEach(function (otherTh) {
                            if (otherTh === th) return;
                            otherTh.dataset.sortDir = 'none';
                            otherTh.classList.remove('sort-asc', 'sort-desc');
                            otherTh.setAttribute('aria-sort', 'none');
                        });

                        const asc = th.dataset.sortDir !== 'asc';
                        th.dataset.sortDir = asc ? 'asc' : 'desc';
                        th.classList.toggle('sort-asc', asc);
                        th.classList.toggle('sort-desc', !asc);
                        th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');

                        sortTable(tbody, index, type, asc);
                    });
                });

                const defaultTh = table.querySelector('thead th[data-default-sort]');
                if (defaultTh) {
                    const index = Array.prototype.indexOf.call(headers, defaultTh);
                    const type = defaultTh.getAttribute('data-type') || 'string';
                    const asc = defaultTh.getAttribute('data-default-sort') !== 'desc';

                    headers.forEach(function (otherTh) {
                        otherTh.dataset.sortDir = 'none';
                        otherTh.classList.remove('sort-asc', 'sort-desc');
                        otherTh.setAttribute('aria-sort', 'none');
                    });

                    defaultTh.dataset.sortDir = asc ? 'asc' : 'desc';
                    defaultTh.classList.add(asc ? 'sort-asc' : 'sort-desc');
                    defaultTh.setAttribute('aria-sort', asc ? 'ascending' : 'descending');

                    sortTable(tbody, index, type, asc);
                }
            });
        });
    })();

    // ─── Column Toggle ───────────────────────────────────────────────────────────
    (function () {
        const STORAGE_KEY = 'slapshot_col_prefs_' + window.location.pathname;

        function getPrefs() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function savePrefs(prefs) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs));
            } catch (e) {}
        }

        function applyVisibility(col, visible, table) {
            table.querySelectorAll('[data-col="' + col + '"]').forEach(function (el) {
                el.classList.toggle('col-hidden', !visible);
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            const toggleBar = document.getElementById('colToggles');
            if (!toggleBar) return;

            const table = document.querySelector('.stats-table');
            if (!table) return;

            const buttons = toggleBar.querySelectorAll('.col-toggle-btn');
            const prefs = getPrefs();

            const state = {};
            buttons.forEach(function (btn) {
                state[btn.getAttribute('data-col')] = btn.classList.contains('active');
            });

            if (prefs) {
                Object.keys(prefs).forEach(function (col) {
                    if (col in state) state[col] = prefs[col];
                });
            }

            buttons.forEach(function (btn) {
                const col = btn.getAttribute('data-col');
                btn.classList.toggle('active', state[col]);
                applyVisibility(col, state[col], table);
            });

            buttons.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const col = btn.getAttribute('data-col');
                    state[col] = !state[col];
                    btn.classList.toggle('active', state[col]);
                    applyVisibility(col, state[col], table);
                    savePrefs(state);
                });
            });
        });
    })();
</script>
</html>
